<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant Booking</title>

    {% load static %}

    <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

</head>

<body class="{% block body_class %}{% endblock %}">

<header class="main-header">

<nav class="main-nav container">

<a href="{% url 'pages:home' %}">Главная</a>
<a href="{% url 'pages:about' %}">О нас</a>
<a href="{% url 'booking:booking' %}">Бронирование</a>

{% if user.is_authenticated %}

<a href="{% url 'booking:my_reservations' %}">Мои Бронирования</a>

<form action="{% url 'logout' %}" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="btn btn-link nav-link p-0" style="display:inline;">
        Выйти
    </button>
</form>

{% else %}

<a href="{% url 'login' %}">Войти</a>
<a href="{% url 'users:register' %}">Зарегистрироваться</a>

{% endif %}

</nav>

</header>

{% block content %}

{% endblock %}

<footer class="footer">

<div class="container">

<h4>Контакты</h4>

<p>Ростов-на-Дону Большая Садовая 161</p>

<p>Email: xxx@mail.ru</p>

<p>Тел: 89528612548</p>

</div>

</footer>

<script src="{% static 'js/main.js' %}"></script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="{% static 'js/booking.js' %}"></script>

</body>
</html>
