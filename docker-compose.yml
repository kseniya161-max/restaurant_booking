services:

  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "
      sleep 5 &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db