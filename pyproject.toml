[project]
name = "restaurant-booking"
version = "0.1.0"
description = ""
authors = [
    {name = "Kseniya Bakhareva", email = "baharevaxen@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

[tool.poetry.group.dev.dependencies]
black = ">=26.3.1,<27.0.0"
flake8 = ">=7.3.0,<8.0.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py313"]
exclude = '''
/(
    migrations
    | venv
    | .venv
    | build
    | dist
)/
'''
