{% extends "base.html" %}
{% block body_class %}detail-page{% endblock %}
{% block content %}
<h1 class="page-title">Редактировать бронирование</h1>
<section class="contact-form container mt-5 mb-5">

<div class="form-wrapper">

<form method="post">

{% csrf_token %}

<div class="form-group">
<label>Стол</label>
{{ form.table }}
</div>

<div class="form-group">
<label>Дата</label>
{{ form.date }}
</div>

<div class="form-group">
<label>Время</label>
{{ form.time }}
</div>

    <div class="form-group">
<label>Количество гостей</label>
{{ form.guests}}
</div>

<button type="submit" class='btn btn-dark btn-sm mt-2 mb-2'>
Забронировать

</button>
 <a href="{% url 'booking:my_reservations' %}">Назад</a>
</form>

</div>

</section>

{% endblock %}
