{% extends "base.html" %}

{% block content %}

<h2>Отмена бронирования</h2>

<p>
Вы уверены что хотите отменить бронирование
<strong>{{ object.table }}</strong>
на дату
<strong>{{ object.date }}</strong>
?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, отменить</button>
</form>

<a href="{% url 'booking:my_reservations' %}">Назад</a>

{% endblock %}
